<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CVE3PO — Sign in</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('cve3po-theme');
                if (t === 'light') document.documentElement.classList.remove('dark');
                else document.documentElement.classList.add('dark');
            } catch (e) { document.documentElement.classList.add('dark'); }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "background": "rgb(var(--md-bg) / <alpha-value>)",
                    "surface": "rgb(var(--md-bg) / <alpha-value>)",
                    "surface-container-lowest": "rgb(var(--md-lowest) / <alpha-value>)",
                    "surface-container-low": "rgb(var(--md-panel-2) / <alpha-value>)",
                    "surface-container": "rgb(var(--md-panel) / <alpha-value>)",
                    "on-surface": "rgb(var(--md-text) / <alpha-value>)",
                    "on-surface-variant": "rgb(var(--md-muted) / <alpha-value>)",
                    "outline": "rgb(var(--md-faint) / <alpha-value>)",
                    "outline-variant": "rgb(var(--md-line) / <alpha-value>)",
                    "primary": "rgb(var(--md-accent) / <alpha-value>)",
                    "primary-container": "rgb(var(--md-accent-container) / <alpha-value>)",
                    "on-primary": "rgb(var(--md-on-accent) / <alpha-value>)",
                    "error": "rgb(var(--md-crit) / <alpha-value>)",
                    "error-container": "rgb(var(--md-crit) / <alpha-value>)",
                    "on-error-container": "rgb(255 255 255 / <alpha-value>)"
                },
                fontFamily: { "headline": ["Manrope"], "body": ["Inter"], "label": ["Inter"] },
                borderRadius: { "DEFAULT": "0.25rem", "lg": "0.3125rem", "xl": "0.375rem", "2xl": "0.5rem", "3xl": "0.625rem", "full": "9999px" }
            } }
        }
    </script>
    <style>
        :root { --md-bg:236 238 240; --md-panel:255 255 255; --md-panel-2:246 247 248; --md-lowest:255 255 255; --md-text:20 24 28; --md-muted:91 99 107; --md-faint:139 146 154; --md-line:223 226 229; --md-accent:37 99 235; --md-accent-container:37 99 235; --md-on-accent:255 255 255; --md-crit:229 72 77; }
        html.dark { --md-bg:13 15 18; --md-panel:22 25 29; --md-panel-2:16 19 22; --md-lowest:10 11 13; --md-text:230 232 235; --md-muted:154 161 169; --md-faint:107 113 120; --md-line:42 47 54; --md-accent:91 141 255; --md-accent-container:79 140 255; --md-on-accent:255 255 255; --md-crit:229 72 77; }
        body { background: rgb(var(--md-bg)); color: rgb(var(--md-text)); font-family:'Inter',sans-serif; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
        .dotgrid { background-image: radial-gradient(rgb(var(--md-line)) 1px, transparent 1px); background-size: 26px 26px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 dotgrid">
    <button id="themeToggle" type="button" aria-label="Toggle theme"
            class="fixed top-5 right-5 flex items-center justify-center w-9 h-9 rounded-md text-on-surface-variant hover:text-primary transition-colors"
            style="border:1px solid rgb(var(--md-line)); background: rgb(var(--md-panel));">
        <span class="material-symbols-outlined text-lg" id="themeIconDark">dark_mode</span>
        <span class="material-symbols-outlined text-lg hidden" id="themeIconLight">light_mode</span>
    </button>

    <main class="w-full max-w-[400px]">
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-13 h-13 rounded-xl mb-3.5" style="width:52px;height:52px;background:rgb(var(--md-accent) / .14);">
                <span class="material-symbols-outlined text-primary" style="font-size:26px;">shield</span>
            </div>
            <h1 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface mb-1">CVE3PO</h1>
            <p class="text-outline text-[11px] font-semibold tracking-wide">VULNERABILITY MANAGEMENT</p>
        </div>

        <div class="rounded-2xl p-7" style="background:rgb(var(--md-panel)); border:1px solid rgb(var(--md-line));">
            <h2 class="font-headline text-lg font-bold text-on-surface mb-5">Sign in</h2>

            {% if login_error %}
            <div class="mb-5 rounded-lg border border-error/40 bg-error/10 px-4 py-3 text-xs text-error">
                {{ login_error }}
            </div>
            {% endif %}

            <form class="space-y-4" method="POST" action="{% url 'login' %}?next={{ request.GET.next|urlencode }}">
                {% csrf_token %}
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-semibold text-on-surface-variant" for="identifier">Username or email</label>
                    <input class="block w-full text-sm text-on-surface rounded-lg px-3.5 py-2.5 transition-all" style="background:rgb(var(--md-panel-2)); border:1px solid rgb(var(--md-line));" id="identifier" name="identifier" placeholder="analyst@cve3po.io" value="{{ login_identifier|default:'' }}" required type="text"/>
                </div>
                <div class="space-y-1.5">
                    <div class="flex justify-between items-baseline">
                        <label class="block text-[11px] font-semibold text-on-surface-variant" for="password">Password</label>
                        <a class="text-[11px] font-semibold text-primary hover:opacity-80 transition-opacity" href="{% url 'password_reset' %}">Forgot access?</a>
                    </div>
                    <input class="block w-full text-sm text-on-surface rounded-lg px-3.5 py-2.5 transition-all" style="background:rgb(var(--md-panel-2)); border:1px solid rgb(var(--md-line));" id="password" name="password" placeholder="••••••••••" required type="password"/>
                </div>
                <button class="w-full flex justify-center items-center gap-2 py-3 px-6 rounded-lg bg-primary text-on-primary text-sm font-semibold hover:opacity-90 active:scale-[0.99] transition-all mt-2" type="submit">
                    Sign in
                </button>
            </form>

            <div class="mt-6 flex items-center gap-3">
                <span class="h-px flex-1" style="background:rgb(var(--md-line));"></span>
                <span class="text-[10px] font-semibold tracking-wide text-outline">INTERNAL ACCESS ONLY</span>
                <span class="h-px flex-1" style="background:rgb(var(--md-line));"></span>
            </div>
        </div>

        <p class="text-center mt-5 text-xs text-on-surface-variant">
            CVE3PO Vulnerability Management · GNU GPL v3.0
        </p>
    </main>

    <script>
        (function () {
            var btn = document.getElementById('themeToggle'),
                iD = document.getElementById('themeIconDark'),
                iL = document.getElementById('themeIconLight');
            function sync(){ var d=document.documentElement.classList.contains('dark'); iD.classList.toggle('hidden',!d); iL.classList.toggle('hidden',d); }
            sync();
            btn.addEventListener('click', function(){ var d=document.documentElement.classList.toggle('dark'); try{localStorage.setItem('cve3po-theme',d?'dark':'light');}catch(e){} sync(); });
        })();
    </script>
</body>
</html>

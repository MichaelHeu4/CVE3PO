{% for vuln in vulns %}
<div class="vuln-card bg-surface-container border border-outline-variant rounded-md p-4 hover:bg-surface-container-high transition-colors cursor-grab active:cursor-grabbing relative group"
     data-id="{{ vuln.id }}" data-sev-score="{{ vuln.sev_score }}">

    <!-- Severity Indicator (Vertical bar) -->
    <div class="absolute left-0 top-6 bottom-6 w-1 rounded-r-full severity-{{ vuln.severity|lower }}"></div>

    <div class="flex justify-between items-start mb-3 ms-2">
        <span class="text-[11px] font-bold text-outline">{{ vuln.severity|upper }}</span>
        <a href="{% url 'vuln_detail' vuln.id %}" class="opacity-0 group-hover:opacity-100 text-primary transition-opacity">
            <span class="material-symbols-outlined text-sm">open_in_new</span>
        </a>
    </div>

    <h6 class="font-semibold text-on-surface text-sm mb-1 ms-2 leading-tight">
        <a href="{% url 'vuln_detail' vuln.id %}" class="hover:text-primary transition-colors">{{ vuln.cve_id }}</a>
    </h6>
    <p class="text-[10px] text-on-surface-variant line-clamp-2 ms-2 mb-4">{{ vuln.name }}</p>

    <div class="flex items-center gap-2 mt-auto pt-3 border-t border-outline-variant ms-2">
        <div class="w-5 h-5 rounded-lg bg-surface-container-highest flex items-center justify-center">
            <span class="material-symbols-outlined text-[10px] text-outline">dns</span>
        </div>
        <span class="text-[11px] font-bold text-outline tracking-wider truncate">
            {% if vuln.host %}{{ vuln.host.ip_address }}{% else %}{{ vuln.software.name }}{% endif %}
        </span>
    </div>
</div>
{% endfor %}

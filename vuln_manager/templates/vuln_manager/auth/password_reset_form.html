<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CVE3PO — Reset password</title>
    <script>(function(){try{var t=localStorage.getItem('cve3po-theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();</script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vuln_manager/css/app.css' %}"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        :root { --md-bg:236 238 240; --md-panel:255 255 255; --md-panel-2:246 247 248; --md-lowest:255 255 255; --md-text:20 24 28; --md-muted:91 99 107; --md-faint:139 146 154; --md-line:223 226 229; --md-accent:37 99 235; --md-accent-container:37 99 235; --md-on-accent:255 255 255; --md-crit:229 72 77; }
        html.dark { --md-bg:13 15 18; --md-panel:22 25 29; --md-panel-2:16 19 22; --md-lowest:10 11 13; --md-text:230 232 235; --md-muted:180 187 196; --md-faint:148 156 166; --md-line:60 67 77; --md-accent:91 141 255; --md-accent-container:79 140 255; --md-on-accent:255 255 255; --md-crit:229 72 77; }
        body { background: rgb(var(--md-bg)); color: rgb(var(--md-text)); font-family:'Inter',sans-serif; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
        .dotgrid { background-image: radial-gradient(rgb(var(--md-line)) 1px, transparent 1px); background-size: 26px 26px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 dotgrid">
    <button id="themeToggle" type="button" aria-label="Toggle theme" class="fixed top-5 right-5 flex items-center justify-center w-9 h-9 rounded-md text-on-surface-variant hover:text-primary transition-colors" style="border:1px solid rgb(var(--md-line)); background: rgb(var(--md-panel));">
        <span class="material-symbols-outlined text-lg" id="themeIconDark">dark_mode</span>
        <span class="material-symbols-outlined text-lg hidden" id="themeIconLight">light_mode</span>
    </button>

    <main class="w-full max-w-[400px]">
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center rounded-xl mb-3.5" style="width:52px;height:52px;background:rgb(var(--md-accent) / .14);">
                <span class="material-symbols-outlined text-primary" style="font-size:26px;">lock_reset</span>
            </div>
            <h1 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface mb-1">CVE3PO</h1>
            <p class="text-outline text-[11px] font-semibold tracking-wide">PASSWORD RECOVERY</p>
        </div>

        <div class="rounded-2xl p-7" style="background:rgb(var(--md-panel)); border:1px solid rgb(var(--md-line));">
            <h2 class="font-headline text-lg font-bold text-on-surface mb-1.5">Forgot access?</h2>
            <p class="text-on-surface-variant text-xs mb-5">Enter your email and we'll send you a reset link.</p>

            {% if form.errors %}
            <div class="mb-5 rounded-lg border border-error/40 bg-error/10 px-4 py-3 text-xs text-error">
                {{ form.errors }}
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-semibold text-on-surface-variant" for="id_email">Email</label>
                    <input class="block w-full text-sm text-on-surface rounded-lg px-3.5 py-2.5 transition-all" style="background:rgb(var(--md-panel-2)); border:1px solid rgb(var(--md-line));" id="id_email" name="email" placeholder="you@company.com" required type="email" value="{{ form.email.value|default:'' }}"/>
                </div>
                <button class="w-full flex justify-center items-center gap-2 py-3 px-6 rounded-lg bg-primary text-on-primary text-sm font-semibold hover:opacity-90 active:scale-[0.99] transition-all mt-2" type="submit">
                    Send reset link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a class="text-[11px] font-semibold text-primary hover:opacity-80 transition-opacity" href="{% url 'login' %}">Back to sign in</a>
            </div>
        </div>
    </main>

    <script>
        (function(){var b=document.getElementById('themeToggle'),iD=document.getElementById('themeIconDark'),iL=document.getElementById('themeIconLight');function s(){var d=document.documentElement.classList.contains('dark');iD.classList.toggle('hidden',!d);iL.classList.toggle('hidden',d);}s();b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('cve3po-theme',d?'dark':'light');}catch(e){}s();});})();
    </script>
</body>
</html>

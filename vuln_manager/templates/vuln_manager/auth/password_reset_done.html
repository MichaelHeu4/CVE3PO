<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CVE3PO — Reset email sent</title>
    <script>(function(){try{var t=localStorage.getItem('cve3po-theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();</script>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Compiled Tailwind after fonts so utility text sizes beat Material Symbols' 24px default -->
    <link rel="stylesheet" href="{% static 'vuln_manager/css/app.css' %}"/>
    <style>
        :root { --md-bg:236 238 240; --md-panel:255 255 255; --md-text:20 24 28; --md-muted:91 99 107; --md-faint:139 146 154; --md-line:223 226 229; --md-accent:37 99 235; --md-on-accent:255 255 255; }
        html.dark { --md-bg:13 15 18; --md-panel:22 25 29; --md-text:230 232 235; --md-muted:180 187 196; --md-faint:148 156 166; --md-line:60 67 77; --md-accent:91 141 255; --md-on-accent:255 255 255; }
        body { background: rgb(var(--md-bg)); color: rgb(var(--md-text)); font-family:'Inter',sans-serif; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
        .dotgrid { background-image: radial-gradient(rgb(var(--md-line)) 1px, transparent 1px); background-size: 26px 26px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 dotgrid">
    <button id="themeToggle" type="button" aria-label="Toggle theme" class="fixed top-5 right-5 flex items-center justify-center w-9 h-9 rounded-md text-on-surface-variant hover:text-primary transition-colors" style="border:1px solid rgb(var(--md-line)); background: rgb(var(--md-panel));">
        <span class="material-symbols-outlined text-lg" id="themeIconDark">dark_mode</span>
        <span class="material-symbols-outlined text-lg hidden" id="themeIconLight">light_mode</span>
    </button>
    <main class="w-full max-w-[400px] text-center">
        <div class="inline-flex items-center justify-center rounded-xl mb-5" style="width:52px;height:52px;background:rgb(48 164 108 / .15);">
            <span class="material-symbols-outlined" style="font-size:28px;color:#30a46c;">mark_email_read</span>
        </div>
        <div class="rounded-2xl p-8" style="background:rgb(var(--md-panel)); border:1px solid rgb(var(--md-line));">
            <h1 class="font-headline text-xl font-bold text-on-surface mb-2">Check your inbox</h1>
            <p class="text-sm text-on-surface-variant leading-relaxed">If your account exists, a password reset email has been sent. Follow the link inside to choose a new password.</p>
            <a href="{% url 'login' %}" class="mt-6 inline-flex items-center gap-1.5 text-[12px] font-semibold text-primary hover:opacity-80 transition-opacity">Back to sign in <span class="material-symbols-outlined text-sm">arrow_forward</span></a>
        </div>
    </main>
    <script>(function(){var b=document.getElementById('themeToggle'),iD=document.getElementById('themeIconDark'),iL=document.getElementById('themeIconLight');function s(){var d=document.documentElement.classList.contains('dark');iD.classList.toggle('hidden',!d);iL.classList.toggle('hidden',d);}s();b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('cve3po-theme',d?'dark':'light');}catch(e){}s();});})();</script>
</body>
</html>
